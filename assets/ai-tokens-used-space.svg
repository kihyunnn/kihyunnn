      <circle cx="94" cy="162" r="1.5" fill="#DAE1F2" fill-opacity="0.82"/>
      <circle cx="301" cy="127" r="1.5" fill="#DAE1F2" fill-opacity="0.32"/>
      <circle cx="278" cy="157" r="1" fill="#DAE1F2" fill-opacity="0.28"/>
    </g>
    <g class="sweep"><rect x="-20" y="-140" width="72" height="520" fill="url(#shine)"/></g>
    <rect x="0.5" y="0.5" width="339" height="199" rx="3.5" stroke="#70A5FD" stroke-opacity="0.035"/>
