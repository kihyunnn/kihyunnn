      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.052"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="nebulaA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(300 45) rotate(90) scale(64 90)">
      <stop stop-color="#70A5FD" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#70A5FD" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(62 172) rotate(90) scale(76 92)">
      <stop stop-color="#BF91F3" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#BF91F3" stop-opacity="0"/>
