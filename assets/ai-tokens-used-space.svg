      @keyframes blink { 0%,100% { opacity: .42; transform: scale(.82); } 48% { opacity: 1; transform: scale(1.16); } }
      @keyframes sweep { 0%,58% { transform: translateX(-210px) rotate(18deg); } 100% { transform: translateX(420px) rotate(18deg); } }
      .blink { transform-box: fill-box; transform-origin: center; animation: blink 1.35s ease-in-out infinite; }
      .sweep { transform-box: fill-box; transform-origin: center; animation: sweep 8.5s ease-in-out infinite; }
    </style>
  </defs>
