    <text x="24" y="144" fill="url(#num)" font-size="57" font-weight="800" letter-spacing="-3.6">37.6B <tspan font-size="22" font-weight="700" letter-spacing="0.4" fill="#DAE1F2" fill-opacity="0.68">Tokens</tspan></text>
    <text x="24" y="173" fill="#DAE1F2" fill-opacity="0.56" font-size="10" font-weight="600" letter-spacing="0.2">updated 2026-07-30 KST</text>
